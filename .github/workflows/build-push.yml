name: 构建并推送 AGS R Meta 沙箱镜像

on:
  push:
    branches: [main]
    paths: [Dockerfile, .github/workflows/build-push.yml]
  workflow_dispatch:
    inputs:
      tag:
        description: 镜像标签
        default: v1

env:
  REGISTRY: ccr.ccs.tencentyun.com
  IMAGE: ccr.ccs.tencentyun.com/r_meta/r-meta-sandbox

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 登录腾讯云个人版镜像仓库
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.CCR_USERNAME }}
          password: ${{ secrets.CCR_PASSWORD }}

      - name: 构建并推送（linux/amd64）
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ inputs.tag || 'v1' }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}

      - name: 验证 R 包可加载
        run: |
          docker run --rm --platform linux/amd64 --entrypoint Rscript \
            ${{ env.IMAGE }}:${{ inputs.tag || 'v1' }} \
            -e 'library(metafor); library(meta); cat("OK\n")'
